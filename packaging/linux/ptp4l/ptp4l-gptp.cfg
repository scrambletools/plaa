# ptp4l for plaa's AVB talker: a gPTP (IEEE 802.1AS) end station that only
# follows time, as linuxptp's configs/gPTP.cfg with gmCapable 0, and as
# triib runs it. plaa-ptp4l@<interface> runs it where nothing else runs
# ptp4l on the interface plaa sends from.
[global]
gmCapable               0
priority1               255
priority2               255
logAnnounceInterval     0
logSyncInterval         -3
syncReceiptTimeout      3
neighborPropDelayThresh 800
min_neighbor_prop_delay -20000000
assume_two_step         1
path_trace_enabled      1
follow_up_info          1
transportSpecific       0x1
ptp_dst_mac             01:80:C2:00:00:0E
network_transport       L2
delay_mechanism         P2P
time_stamping           hardware
# Steps the clock, rather than slewing it for good, when it is a second or
# more off, as after a driver resets the hardware clock: igb does on the
# I210 whenever the link goes down and up.
step_threshold          1.0
