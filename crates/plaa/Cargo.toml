[package]
name = "plaa"
description = "Fast, lightweight media player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
iced = { version = "0.14", features = ["advanced", "image-without-codecs", "markdown"] }
png = "0.18"
scramble-ui.workspace = true
plaa-assist.workspace = true
plaa-avb.workspace = true
plaa-cast.workspace = true
plaa-media.workspace = true
plaa-store.workspace = true
# The interface's text, from i18n/<language>/plaa.ftl (Project Fluent).
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
toml = "1"
# Keeps the screen on while video plays: the screen saver's D-Bus service
# and logind on Linux, power assertions on macOS, execution state on
# Windows.
keepawake = "0.6"
# Outside control: the control channel other programs call the running
# plaa over (JSON-RPC on a local socket or named pipe), and `plaa --mcp`,
# which serves MCP to agents and relays their calls to it.
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync"] }
schemars = "1"
base64 = "0.22"

# The file dialogs and screen sharing: the XDG desktop portal on Linux,
# the system's own dialogs elsewhere, as prev has them.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "open_uri", "screencast"] }
# MPRIS, which media keys and panels play and pause through: the same
# D-Bus library as the portal's.
zbus = "5"
# Files dropped on windows on Wayland, from the patched copy in vendor/,
# and the window's surface they name it by.
smithay-clipboard = "0.7"
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

# The menu bar, and the title bar plaa's chrome runs up behind.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSGeometry", "NSString", "NSUserDefaults", "NSValue"] }
raw-window-handle = "0.6"
# Now Playing: what plays in Control Center, and the media keys.
block2 = "0.6"
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# The System Media Transport Controls: what plays in the media flyout,
# and the media keys; and which app opens each file type, for Default
# apps.
windows = { version = "0.62", features = ["Foundation", "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
# Checks the video shader when tests run, as the graphics card would.
naga = { version = "27", features = ["wgsl-in"] }
