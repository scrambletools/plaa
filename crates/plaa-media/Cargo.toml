[package]
name = "plaa-media"
description = "plaa's media engine: FFmpeg demuxing and decoding, audio output and the clock video follows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# FFmpeg through its C libraries: the system's on Linux, bundled with the
# packages elsewhere.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
# Through the sound server on Linux, PulseAudio or PipeWire, whose devices
# are the ones people know; ALSA when there is none.
cpal = { version = "0.18", features = ["pulseaudio"] }
# Loads libass, which draws ASS subtitles, when the system has it.
libloading = "0.9"
# Reads what yt-dlp says of a web page.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# The subtitles example saves pictures.
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Looks up the name of the VAAPI driver in libva, which FFmpeg loads.
libc = "0.2"
# Takes the frames of a screen recording the ScreenCast portal shares.
pipewire = "0.10"

# ScreenCaptureKit, which records the screen on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDirectDisplay"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString", "NSValue"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
