[package]
name = "plaa-assist"
description = "The model side of plaa's assistant panel: chats with a language model that calls plaa's tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned: plaa-assist is the only place that knows rig, so a new rig
# touches only this crate.
rig-core = { version = "=0.43.0", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Already in through rig; asks local servers what they have.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = "4"

[dev-dependencies]
http = "1"
