[package]
name = "plaa-avb"
description = "plaa on an AVB network: a Milan controller, and a talker sending what plays, on Linux from plaa's entity in avb-endpointd, on a Mac from the Mac's own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
atdecc.workspace = true
avb-net.workspace = true
avb-stream.workspace = true

# On Linux, avb-endpointd's files, which list plaa's entity for the daemon
# and say how it stands, and the daemon's audio devices, found through the
# sound server by their node names.
[target.'cfg(target_os = "linux")'.dependencies]
avb-endpointd.workspace = true
cpal = { version = "0.18", features = ["pulseaudio"] }

# The Mac's own AVB entity's Core Audio device, found by its UID.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
