<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c1f45" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- the screen -->
  <g filter="url(#shadow)">
    <rect x="10" y="20" width="108" height="88" rx="18" fill="url(#screen)"/>
  </g>
  <rect x="10" y="20" width="108" height="88" rx="18" fill="url(#sheen)"/>
  <!-- play -->
  <path d="M46 46 L46 82 L76 64 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- sound -->
  <path d="M90 52 a16 16 0 0 1 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 42 a28 28 0 0 1 0 44" fill="none" stroke="#ffd43b" stroke-width="6" stroke-linecap="round"/>
</svg>
