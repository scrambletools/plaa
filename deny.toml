# Dependency policy: open source only, and compatible with GPL-3.0-or-later.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# The FFmpeg bindings are under the WTFPL, which places no conditions and
# so combines with the GPL; FFmpeg itself is LGPL or GPL as built.
[[licenses.exceptions]]
crate = "ffmpeg-next"
allow = ["WTFPL"]

[[licenses.exceptions]]
crate = "ffmpeg-sys-next"
allow = ["WTFPL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# scramble-ui, the interface shared by Scramble Tools apps, pinned by commit.
allow-git = [
    "https://github.com/scrambletools/scramble-ui",
    "https://github.com/scrambletools/avb",
]
