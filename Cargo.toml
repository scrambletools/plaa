[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/scrambletools/plaa"

[workspace.dependencies]
plaa-avb = { path = "crates/plaa-avb", version = "0.1.0" }
plaa-media = { path = "crates/plaa-media", version = "0.1.0" }
plaa-store = { path = "crates/plaa-store", version = "0.1.0" }
# The AVB crates, shared with triib, pinned by revision. A git-ignored
# .cargo/avb-local.toml can point them at a local checkout while changing
# both (see the README).
atdecc = { git = "https://github.com/scrambletools/avb", rev = "dc1b9dc10f40255295da3e4c8e0e9fa6f711caf9", version = "0.1.0" }
avb-mrp = { git = "https://github.com/scrambletools/avb", rev = "dc1b9dc10f40255295da3e4c8e0e9fa6f711caf9", version = "0.1.0" }
avb-net = { git = "https://github.com/scrambletools/avb", rev = "dc1b9dc10f40255295da3e4c8e0e9fa6f711caf9", version = "0.1.0" }
avb-stream = { git = "https://github.com/scrambletools/avb", rev = "dc1b9dc10f40255295da3e4c8e0e9fa6f711caf9", version = "0.1.0" }
# Material Design 3 for iced, shared by Scramble Tools apps. A git-ignored
# .cargo/scramble-ui-local.toml can point it at a local checkout while
# changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "d01a1eab3b8e343207d5cfcf25a9cc46482304be", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "d01a1eab3b8e343207d5cfcf25a9cc46482304be" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "d01a1eab3b8e343207d5cfcf25a9cc46482304be" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "d01a1eab3b8e343207d5cfcf25a9cc46482304be" }
# Drag and drop on Wayland, on the data device iced's clipboard makes; see
# vendor/PATCHES.md.
smithay-clipboard = { path = "vendor/smithay-clipboard" }
