[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/scrambletools/plaa"

[workspace.dependencies]
plaa-assist = { path = "crates/plaa-assist", version = "0.5.0" }
plaa-avb = { path = "crates/plaa-avb", version = "0.5.0" }
plaa-cast = { path = "crates/plaa-cast", version = "0.5.0" }
plaa-media = { path = "crates/plaa-media", version = "0.5.0" }
plaa-store = { path = "crates/plaa-store", version = "0.5.0" }
# The AVB crates, shared with triib, from crates.io. A git-ignored
# .cargo/avb-local.toml can point them at a local checkout while changing
# both (see the README).
atdecc = "0.1.3"
avb-lite = "0.1.0"
avb-mrp = "0.1.3"
avb-net = "0.1.0"
avb-stream = "0.1.1"
# Material Design 3 for iced, shared by Scramble Tools apps. A git-ignored
# .cargo/scramble-ui-local.toml can point it at a local checkout while
# changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
# Drag and drop on Wayland, on the data device iced's clipboard makes; see
# vendor/PATCHES.md.
smithay-clipboard = { path = "vendor/smithay-clipboard" }
