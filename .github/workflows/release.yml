name: Release

# A tag such as v0.2.0 builds every package and drafts a GitHub release
# with them. Running the workflow by hand builds the same packages, or
# only those of one system, without a release, to try the packaging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Packages to build
        type: choice
        options: [all, linux, windows, macos]
        default: all

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.43.0
  # A shared FFmpeg build for Windows, its headers, import libraries and
  # DLLs, as CI builds with.
  FFMPEG_RELEASE: n9.0-latest
  FFMPEG_SERIES: '9.0'

jobs:
  linux:
    # Each package is built in a container of the release it is for, as
    # FFmpeg's libraries change names from release to release: a .deb for
    # each Debian and Ubuntu, an .rpm for Fedora, each depending on what
    # the programs link (packaging/linux/build.sh). They grant plaa-netraw,
    # which opens plaa's raw sockets, CAP_NET_RAW as they install. No plain
    # archive, AppImage or Flatpak: none can carry the capability, and an
    # archive would hold one release's FFmpeg names.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    name: linux (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04', 'fedora:44']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Check the desktop entry and metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
      - name: Package name
        id: name
        run: echo "name=$(tr -c 'a-z0-9\n' - <<<"$IMAGE")" >>"$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
      - name: Build and package
        run: packaging/linux/build.sh "$IMAGE" dist
        env:
          IMAGE: ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.name.outputs.name }}-${{ matrix.arch }}
          path: dist/*

  windows:
    # plaa.exe with the FFmpeg DLLs it loads, in the MSI installer and a
    # zip. Microsoft's Azure Artifact Signing signs the programs and the
    # MSI once the repository variable AZURE_SIGNING_ACCOUNT is set (see
    # docs/RELEASING.md); until then the files are unsigned. The job signs
    # in to Azure with GitHub's OpenID Connect token, so no secret is kept,
    # as the environment "release" that Azure trusts.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            ffmpeg: win64
          - arch: arm64
            runner: windows-11-arm
            ffmpeg: winarm64
    runs-on: ${{ matrix.runner }}
    env:
      SIGNING: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # bindgen reads FFmpeg's headers through LLVM's libclang.
      - name: LLVM
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) { winget install --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: FFmpeg
        shell: pwsh
        run: |
          $build = "ffmpeg-$env:FFMPEG_RELEASE-${{ matrix.ffmpeg }}-gpl-shared-$env:FFMPEG_SERIES"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP $build
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $dir bin | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        run: cargo build --release --locked -p plaa
        env:
          PLAA_PRODUCTION: '1'
      # plaa.exe is a Windows GUI program, which PowerShell would not wait
      # for.
      - name: Check that it runs
        shell: pwsh
        run: |
          $run = Start-Process target\release\plaa.exe -ArgumentList --version -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          $version = Get-Content -Raw version.txt
          Write-Host $version
          if ($run.ExitCode -ne 0 -or $version -notmatch '^plaa \d.*FFmpeg \d') { throw "plaa.exe --version failed" }
      - name: Collect the program and FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\plaa.exe dist\
          Copy-Item (Join-Path $env:FFMPEG_DIR 'bin\*.dll') dist\
          Copy-Item (Join-Path $env:FFMPEG_DIR 'LICENSE.txt') dist\
      - if: env.SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Signs the program and the DLLs themselves, before the installer and
      # zip take them.
      - if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,dll
          description: plaa
          description-url: https://github.com/scrambletools/plaa
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          cache-dependencies: false
      - name: Installer and zip
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          packaging\windows\build.ps1 -Version $version -Source dist -Out packages -Arch ${{ matrix.arch }} -Icon packaging\windows\plaa.ico
      - if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\packages
          files-folder-filter: msi
          description: plaa
          description-url: https://github.com/scrambletools/plaa
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          cache-dependencies: false
      # The signatures, checked: an unsigned file must not go out as a
      # signed release.
      - if: env.SIGNING == 'true'
        name: Check the signatures
        shell: pwsh
        run: |
          foreach ($file in @(Get-ChildItem dist\*.exe) + @(Get-ChildItem dist\*.dll) + @(Get-ChildItem packages\*.msi)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not signed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: packages/*

  macos:
    # plaa.app in an installer package for Apple Silicon, carrying
    # Homebrew's FFmpeg and libass, built on the oldest macOS supported, as
    # Homebrew builds them for the macOS it runs on; the package also lets
    # plaa reach the network for AVB (packaging/macos). The sources of the
    # libraries it carries go with the release. Once the repository
    # variable MACOS_APP_IDENTITY is set (see docs/RELEASING.md), the app
    # and package carry Scramble Tools' Developer ID signatures and the
    # package is notarized; until then they are signed ad hoc. The
    # certificates and the App Store Connect API key are secrets of the
    # environment "release".
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    environment: release
    runs-on: macos-14
    env:
      SIGNING: ${{ vars.MACOS_APP_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg and libass
        run: brew install ffmpeg libass pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: libclang for bindgen
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >>"$GITHUB_ENV"
      # A keychain of its own holding the two Developer ID identities, for
      # this run only, and the notary key beside it.
      - if: env.SIGNING == 'true'
        name: Signing keychain
        env:
          APP_P12: ${{ secrets.MACOS_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          APP_IDENTITY: ${{ vars.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for name in APP_P12 INSTALLER_P12; do
            printf '%s' "${!name}" | base64 --decode >"$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$keychain"
          printf '%s' "$NOTARY_KEY" | base64 --decode >"$RUNNER_TEMP/notary.p8"
          {
            echo "PLAA_SIGN_KEYCHAIN=$keychain"
            echo "PLAA_SIGN_KEYCHAIN_PASSWORD=$password"
            echo "PLAA_SIGN_IDENTITY=$APP_IDENTITY"
            echo "PLAA_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
            echo "PLAA_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "PLAA_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "PLAA_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >>"$GITHUB_ENV"
      - name: App and installer package
        run: packaging/macos/bundle.sh --pkg --out dist
        env:
          PLAA_PRODUCTION: '1'
      - name: Check that it runs
        run: |
          version=$(dist/plaa.app/Contents/MacOS/plaa --version)
          echo "$version"
          [[ $version == plaa\ [0-9]*FFmpeg\ [0-9]* ]]
          pkgutil --payload-files dist/*.pkg | grep -q 'Library/LaunchDaemons/io.github.scrambletools.plaa.bpf.plist'
      # The signatures, checked against the identities named: a package
      # signed by anyone else, or not notarized, must not go out.
      - if: env.SIGNING == 'true'
        name: Check the signatures
        run: |
          codesign --verify --strict --deep --verbose=2 dist/plaa.app
          codesign -dvv dist/plaa.app 2>&1 | grep -Fx "Authority=$PLAA_SIGN_IDENTITY"
          for library in dist/plaa.app/Contents/Frameworks/*.dylib; do
            codesign -dvv "$library" 2>&1 | grep -Fqx "Authority=$PLAA_SIGN_IDENTITY"
          done
          pkgutil --check-signature dist/*.pkg | tee signature.txt
          grep -F "1. $PLAA_INSTALLER_IDENTITY" signature.txt
          grep -F "Notarization: trusted by the Apple notary service" signature.txt
          xcrun stapler validate dist/*.pkg
          spctl --assess --type install --verbose=2 dist/*.pkg
          spctl --assess --type execute --verbose=2 dist/plaa.app
      - if: always() && env.SIGNING == 'true'
        name: Remove the signing keychain
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      # The source of each library the app carries, as its licenses ask.
      - name: The libraries' sources
        run: |
          mkdir -p sources
          cp dist/plaa.app/Contents/Resources/licenses/libraries.txt sources/
          awk '$1 ~ /^https?:/ {print $1}' sources/libraries.txt | sort -u | while read -r url; do
            curl -sSLf -o "sources/$(basename "$url")" "$url"
          done
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tar -cf "dist/plaa-$version-macos-library-sources.tar" -C sources .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.pkg
            dist/*-library-sources.tar

  # The packages, installed as users would install them, in clean systems
  # where nothing but what each package brings or depends on can supply
  # what plaa needs: each is installed, upgraded from the last release,
  # run, made to play a video and removed by the scripts in
  # packaging/tests. A release is only drafted once they pass.
  linux-install:
    name: linux-install (${{ matrix.image }}, ${{ matrix.arch }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04', 'fedora:44']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Package name
        id: name
        run: echo "name=$(tr -c 'a-z0-9\n' - <<<"$IMAGE")" >>"$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ steps.name.outputs.name }}-${{ matrix.arch }}
          path: packages
      - name: Install, upgrade, run, play and remove
        run: |
          package=$(ls packages/*.deb packages/*.rpm 2>/dev/null | head -1)
          previous=$(packaging/tests/previous-release.sh "$package" previous)
          packaging/tests/linux/run.sh "$IMAGE" "$package" $previous
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
          PLAA_TEST_SHOTS: shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-linux-${{ steps.name.outputs.name }}-${{ matrix.arch }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  arch-install:
    # The PKGBUILD, built from this tree in a fresh Arch container as
    # someone building it would, and its package tested like the others.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/plaa/PKGBUILD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$pkgver" != "$version" ]; then
            echo "The PKGBUILD's pkgver $pkgver is not version $version in Cargo.toml" >&2
            exit 1
          fi
          git archive --prefix="plaa-$pkgver/" -o "plaa-$pkgver.tar.gz" HEAD
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
            packaging/tests/linux/build-arch.sh "plaa-$pkgver.tar.gz" dist-arch
      - name: Install, run, play and remove
        run: packaging/tests/linux/run.sh archlinux:latest dist-arch/plaa-[0-9]*.pkg.tar.zst
        env:
          PLAA_TEST_SHOTS: shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-arch
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  windows-install:
    # On GitHub's runners, which have far more installed than a clean
    # Windows, so the test also checks each program's and DLL's imports
    # against those Windows itself provides.
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: packages
      - name: The last release's installer
        id: previous
        shell: bash
        run: echo "msi=$(packaging/tests/previous-release.sh packages/*.msi previous)" >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install, upgrade, run, play and remove
        shell: pwsh
        run: packaging\tests\windows\test-msi.ps1 -Msi (Get-Item packages\*.msi).FullName -Previous "$env:PREVIOUS"
        env:
          PREVIOUS: ${{ steps.previous.outputs.msi }}

  windows-clean:
    # A Windows Server container, which has neither the Visual C++ runtime
    # nor anything else a runner brings, nor a desktop for the window.
    # Process isolation needs the container's Windows to be the host's.
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: packages
      - name: Install, run and remove in a clean Windows
        shell: pwsh
        run: |
          $msi = (Get-Item packages\*.msi).Name
          docker run --rm -v "${{ github.workspace }}:C:\work" mcr.microsoft.com/windows/server:ltsc2022 `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\work\packaging\tests\windows\test-msi.ps1 `
            -Msi "C:\work\packages\$msi" -NoWindow
          if ($LASTEXITCODE -ne 0) { throw "the test failed in the container" }

  macos-install:
    # Each macOS that GitHub runs, each a fresh machine.
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: packages
      - name: Install, upgrade, run, play and remove
        run: |
          package=$(ls packages/*.pkg)
          previous=$(packaging/tests/previous-release.sh "$package" previous)
          packaging/tests/macos/test-pkg.sh "$package" $previous
        env:
          GH_TOKEN: ${{ github.token }}
          PLAA_EXPECT_SIGNED: ${{ vars.MACOS_APP_IDENTITY != '' }}

  aur:
    # The AUR package builds from GitHub's source archive of the tag; its
    # checksum is only known once the tag exists.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD with the source checksum
        run: |
          curl -sSLf -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          mkdir -p aur
          sed "s/^sha256sums=('SKIP')/sha256sums=('$sum')/" packaging/arch/plaa/PKGBUILD >aur/PKGBUILD
          cp packaging/arch/plaa/plaa.install aur/
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: aur/*

  release:
    if: github.ref_type == 'tag'
    needs: [linux, aur, windows, macos, linux-install, arch-install, windows-install, windows-clean, macos-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and notes
        run: |
          mkdir -p upload
          cp artifacts/linux-*/* artifacts/windows-*/* artifacts/macos-*/* upload/
          # The PKGBUILD and its install file, to build the Arch package.
          cp artifacts/aur/* upload/
          (cd upload && sha256sum * >SHA256SUMS)
          version=${GITHUB_REF_NAME#v}
          # This version's section of the changelog, without its heading.
          touch notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^## / { found = index($0, "[" version "]") > 0; next }
              found' CHANGELOG.md >notes.md
          fi
      - name: Draft the release
        run: |
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" upload/* \
            --draft --title "plaa ${GITHUB_REF_NAME#v}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
