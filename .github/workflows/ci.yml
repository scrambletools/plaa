name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev libpipewire-0.3-dev \
            desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: desktop-file-validate data/*.desktop
      # plaa's ID is run.plaa, plaa.run reversed, which has two parts
      # where AppStream looks for three.
      - run: appstreamcli validate --no-net --override=cid-desktopapp-is-not-rdns=info data/*.metainfo.xml

  macos:
    # Apple Silicon, with Homebrew's FFmpeg; releases will bundle their own.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg
        run: brew install ffmpeg pkgconf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: libclang for bindgen
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >>"$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p plaa
      - name: Check that it runs
        run: target/release/plaa --version

  windows:
    runs-on: windows-2025
    env:
      # bindgen reads FFmpeg's headers through the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # A shared FFmpeg build, its headers, import libraries and DLLs, the
      # one the Release workflow pins.
      FFMPEG_BUILDS_TAG: autobuild-2026-09-30-13-08
      FFMPEG_BUILD: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
      FFMPEG_SHA256: 3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_BUILDS_TAG/$env:FFMPEG_BUILD.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $hash = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "$env:FFMPEG_BUILD.zip has SHA-256 $hash, not the one pinned" }
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP $env:FFMPEG_BUILD
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $dir bin | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p plaa
      - name: Check that it runs
        run: target\release\plaa.exe --version

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev libpipewire-0.3-dev
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
